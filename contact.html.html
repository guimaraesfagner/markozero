<main>
    <div class="container" style="padding-top: 120px;">
        <h2>Contato</h2>
        <form class="contact-form" action="#" method="post">
            <div class="form-group"><input type="text" placeholder="Seu nome" required></div>
            <div class="form-group"><input type="email" placeholder="E-mail" required></div>
            <div class="form-group"><textarea rows="5" placeholder="Mensagem para a gravadora..."></textarea></div>
            <button type="submit" class="btn-submit">Enviar</button>
        </form>
        <p style="text-align:center; margin-top:30px;">Para demos: <strong>demo@markozero.com</strong></p>
    </div>
</main>
