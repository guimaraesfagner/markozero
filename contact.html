<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Markozero</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>...</header>
    <main>
        <div class="container" style="padding-top: 120px;">
            <h2>Contato</h2>
            <p class="section-subtitle">Fale com a gravadora</p>
            <form class="contact-form" action="#" method="post">
                <div class="form-group"><input type="text" placeholder="Seu nome" required></div>
                <div class="form-group"><input type="email" placeholder="E-mail" required></div>
                <div class="form-group"><textarea rows="5" placeholder="Mensagem para a Markozero..."></textarea></div>
                <button type="submit" class="btn-submit">Enviar mensagem</button>
            </form>
            <p style="text-align:center; margin-top:30px;">Para demos: <strong>demo@markozero.com</strong></p>
        </div>
    </main>
    <div class="fixed-player" id="fixedPlayer">...</div>
    <footer class="site-footer">...</footer>
    <script src="js/main.js"></script>
</body>
</html>
